name: CI EstoqueToc # Nome da ação

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop
    types: [opened, reopened]

jobs:
  build: # Job para o build da aplicação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn -f ./crud/pom.xml -B package -DskipTests

  test: # Job para rodar os testes
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Test with Maven
        run: mvn -f ./crud/pom.xml test
