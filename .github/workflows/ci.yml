name: CI EstoqueToc # Nome da ação

on:
  pull_request: # Gatilho para Pull Request
    branches:
      - develop
    types: [opened, reopened] # Tipos de eventos que disparam o pipeline

jobs:
  build: # Job para o build da aplicação
    runs-on: ubuntu-latest # Sistema operacional a ser utilizado
    steps:
      - name: Checkout code # Clonar o repositório
        uses: actions/checkout@v4

      - name: Set up JDK 17 # Configurar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven # Executar o build com Maven
        run: mvn -f ./crud/pom.xml -B package -DskipTests

  test: # Job para rodar os testes da aplicação
    runs-on: ubuntu-latest
    needs: build # Dependência: só será executado após o build com sucesso
    steps:
      - name: Checkout code # Clonar o repositório
        uses: actions/checkout@v4

      - name: Set up JDK 17 # Configurar o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Test with Maven # Executar os testes com Maven
        run: mvn -f ./crud/pom.xml test
